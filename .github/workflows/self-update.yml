name: Self-update promotion

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Promotion operation
        required: true
        type: choice
        options: [promote, rollback]
      commit_sha:
        description: Candidate commit for promotion or baseline commit for rollback
        required: true
        type: string
      baseline_sha:
        description: Known-good commit used for rollback
        required: true
        type: string
      environment:
        description: Deployment environment
        required: true
        default: production
        type: string

permissions:
  contents: read

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out immutable target commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run web:build
      - run: npm run package:unsigned
      - name: Require Cloudflare deployment configuration
        if: ${{ inputs.operation == 'promote' || inputs.operation == 'rollback' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
      - name: Deploy verified artifact to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          npx --yes wrangler@4 pages deploy dist/web \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "${{ inputs.environment }}"
